name: Android

# App Android nativo (pasta android/). Não toca no web app.
# Ações de terceiros fixadas por commit (SHA): a chave de assinatura passa por aqui.
on:
  push:
    branches: [master, android-app, app-conta]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.11.1'

jobs:
  unidade:
    name: Testes de regra e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Testes de unidade e APK de depuração
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relatorio-unidade
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

  emulador:
    name: Testes no emulador Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Habilitar aceleração (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Alarme tocando de verdade (inclui tela apagada e Doze)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: android
          script: gradle --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relatorio-emulador
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  publicar:
    name: APK assinado na release
    needs: [unidade, emulador]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Só este job escreve no repositório (criar/atualizar a release)
    permissions:
      contents: write
    steps:
      - name: Conferir se há chave de assinatura
        id: chave
        env:
          # Só o "sim/não"; a chave em si entra apenas no passo de assinatura
          TEM_CHAVE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        run: |
          echo "ok=$TEM_CHAVE" >> "$GITHUB_OUTPUT"
          if [ "$TEM_CHAVE" != "true" ]; then echo "::warning::Segredo ANDROID_KEYSTORE_B64 ausente. Nada foi publicado."; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.chave.outputs.ok == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.chave.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        if: steps.chave.outputs.ok == 'true'
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Compilar e assinar
        if: steps.chave.outputs.ok == 'true'
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: alarmeagenda
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/assinatura.p12"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/assinatura.p12"
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/alarme-agenda.apk"
          rm -f "$RUNNER_TEMP/assinatura.p12"
      - name: Publicar na release fixa "android"
        if: steps.chave.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android \
            --title "Alarme Agenda para Android" \
            --notes "APK do app Android. Atualizado automaticamente a cada versão. Baixe pelo botão do web app no celular." \
            --latest=false --target "$GITHUB_SHA"
          gh release upload android "$RUNNER_TEMP/alarme-agenda.apk" --clobber
          gh release edit android --notes "APK do app Android — versão 1.0.${{ github.run_number }} (commit ${GITHUB_SHA::7}). Baixe pelo botão do web app no celular."
