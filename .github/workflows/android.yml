name: Android

# App Android nativo (pasta android/). Não toca no web app.
on:
  push:
    branches: [master, android-app]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.11.1'

jobs:
  unidade:
    name: Testes de regra e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Testes de unidade e APK de depuração
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-unidade
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

  emulador:
    name: Testes no emulador Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Habilitar aceleração (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Alarme tocando de verdade (inclui tela apagada e Doze)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: android
          script: gradle --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-emulador
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  publicar:
    name: APK assinado na release
    needs: [unidade, emulador]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - name: Sem chave de assinatura não publica
        if: env.KEYSTORE_B64 == ''
        run: echo "::warning::Segredo ANDROID_KEYSTORE_B64 ausente. Nada foi publicado."
      - uses: actions/checkout@v4
        if: env.KEYSTORE_B64 != ''
      - uses: actions/setup-java@v4
        if: env.KEYSTORE_B64 != ''
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: env.KEYSTORE_B64 != ''
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Compilar e assinar
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: alarmeagenda
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/assinatura.p12"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/assinatura.p12"
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/alarme-agenda.apk"
          rm -f "$RUNNER_TEMP/assinatura.p12"
      - name: Publicar na release fixa "android"
        if: env.KEYSTORE_B64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android \
            --title "Alarme Agenda para Android" \
            --notes "APK do app Android. Atualizado automaticamente a cada versão. Baixe pelo botão do web app no celular." \
            --latest=false --target "$GITHUB_SHA"
          gh release upload android "$RUNNER_TEMP/alarme-agenda.apk" --clobber
          gh release edit android --notes "APK do app Android — versão 1.0.${{ github.run_number }} (commit ${GITHUB_SHA::7}). Baixe pelo botão do web app no celular."
